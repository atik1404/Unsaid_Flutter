# ---------------------------------------------------------------------------
# Tagged release pipeline.
#
# Triggered by pushing a semver tag (e.g. `v1.2.0`). Builds a signed `prod`
# release APK, distributes it, then creates a GitHub Release with an
# auto-generated changelog and the APK attached.
# ---------------------------------------------------------------------------
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  # Reuse the standard validate → build → distribute pipeline.
  ci:
    uses: ./.github/workflows/_ci.yml
    with:
      flavor: prod
      build-mode: release
      entry-target: lib/main_prod.dart
      distribute: true
      tester-groups: qa
      run-tests: true
      artifact-retention-days: 90
    secrets: inherit

  # Publish the GitHub Release once the APK artifact exists in this run.
  github-release:
    name: Publish GitHub Release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create releases & upload assets
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so the changelog spans tags

      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          name: apk-prod-release
          path: dist

      # Changelog = commit subjects since the previous tag (or all history for
      # the very first tag).
      - name: Generate changelog
        id: changelog
        run: |
          set -euo pipefail
          CURRENT="${GITHUB_REF_NAME}"
          PREVIOUS=$(git describe --tags --abbrev=0 "${CURRENT}^" 2>/dev/null || echo "")
          {
            echo "## ${CURRENT}"
            echo ""
            if [ -n "$PREVIOUS" ]; then
              echo "Changes since ${PREVIOUS}:"
              RANGE="${PREVIOUS}..${CURRENT}"
            else
              echo "Initial release."
              RANGE="${CURRENT}"
            fi
            echo ""
            git log --no-merges --pretty=format:'- %s (%h)' "$RANGE"
          } > CHANGELOG_RELEASE.md
          cat CHANGELOG_RELEASE.md

      - name: Rename APK with version tag
        run: |
          set -euo pipefail
          APK=$(find dist -name '*.apk' | head -1)
          cp "$APK" "dist/unsaid-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: CHANGELOG_RELEASE.md
          files: dist/unsaid-${{ github.ref_name }}.apk
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
