# ---------------------------------------------------------------------------
# Security scanning.
#
# Two independent, complementary scanners:
#   codeql   – static security analysis of the native Android (Kotlin/Java)
#              sources. NOTE: CodeQL does not support Dart, so the Flutter/Dart
#              code is covered by analysis (flutter analyze) + the OSV scan
#              below rather than CodeQL.
#   osv-scan – dependency vulnerability scanning across every ecosystem in the
#              repo (Dart/pub via pubspec.lock, Gradle, GitHub Actions).
#
# Findings surface in the repository's Security ▸ Code scanning tab.
# ---------------------------------------------------------------------------
name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly deep scan (Mondays 03:00 UTC) to catch newly disclosed CVEs.
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (Kotlin/Java)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      security-events: write # upload results to code scanning
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Autobuild compiles the Kotlin/Java sources via Gradle, so the job needs
      # the full Android + Flutter toolchain: the app's build.gradle drives the
      # Flutter Gradle plugin, which reads flutter.sdk from local.properties.
      # This composite installs the JDK, Flutter SDK, restores caches and
      # bootstraps the workspace (incl. codegen the Flutter build depends on).
      - name: Setup Flutter workspace
        uses: ./.github/actions/setup-flutter

      # Generate android/local.properties (flutter.sdk + sdk.dir) and the Gradle
      # glue without a full build, so the autobuilder can resolve and compile
      # the native sources.
      - name: Prepare Android build config
        working-directory: apps
        run: flutter build apk --flavor dev --debug --target=lib/main_dev.dart --config-only

      # build-mode "autobuild" runs the Gradle build so CodeQL can observe the
      # Kotlin/Java compilation. Heavier than "none", but "none" cannot extract
      # this project (the only native source is a Flutter stub MainActivity with
      # imports that aren't resolvable without the build).
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: autobuild

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"

  osv-scan:
    name: Dependency vulnerabilities (OSV)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Scans committed lockfiles (pubspec.lock, Gradle, actions) against the
      # OSV database and uploads SARIF to code scanning.
      - name: Run OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        continue-on-error: true # report, don't block, on newly found CVEs
        with:
          scan-args: |-
            --recursive
            --skip-git
            --format=sarif
            --output=osv-results.sarif
            ./

      - name: Upload OSV results
        if: ${{ always() && hashFiles('osv-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: osv-results.sarif
