name: flutter_multi_package_playground

workspace:
  # apps
  - apps/

  # domain & data
  - domain/
  - data/

  # core
  - core/common/
  - core/entity/
  - core/code_analyzer/
  - core/app_env/

  # shared
  - shared/designsystem/
  - shared/ui/
  - shared/localization/
  - shared/navigation/
  - shared/di/
  - shared/pref_storage/

  # auth related features
  - features/auth/login/
  - features/auth/signup/
  - features/auth/splash/
  - features/auth/onboarding/
  - features/auth/reset_password/
  - features/auth/forgot_password/
  - features/auth/otp_verification/
  # user related features
  - features/user/setting/
  - features/user/profile/
  - features/user/change_password/
  - features/user/delete_account/
  - features/user/notification/
  # post related features
  - features/posts/home/
  - features/posts/create_post/
  - features/posts/post_details/

environment:
  sdk: ^3.12.2

dev_dependencies:
  melos: ^8.0.0

melos:
  command:
    bootstrap:
      environment:
        sdk: ^3.12.2

      dependencies:
        common: ^0.0.1
        database: ^0.0.1
        secured: ^0.0.1
        sharedpref: ^0.0.1
        domain: ^0.0.1
        designsystem: ^0.0.1
        ui: ^0.0.1
        di: ^0.0.1
        navigation: ^0.0.1
        entity: ^0.0.1
        response: ^0.0.1
        data: ^0.0.1
        code_analyzer: ^0.0.1
        localization: ^0.0.1
        pref_storage: ^0.0.1
        app_env: ^0.0.1

        flutter_bloc: ^9.1.1
        bloc_test: ^10.0.0
        mocktail: ^1.0.5
        get_it: ^9.2.1
        cupertino_icons: ^1.0.9
        shared_preferences: ^2.5.5
        equatable: ^2.0.8
        flutter_svg: ^2.3.0
        formz: ^0.8.0
        dio: ^5.10.0
        jiffy: ^6.4.5
        fluttertoast: ^9.1.0
        image_picker: ^1.2.2
        url_launcher: ^6.3.2
        webview_flutter: ^4.14.0
        json_annotation: ^4.12.0
        envied: ^1.3.7
        flutter_local_notifications: ^22.0.1
        intl: ^0.20.2
        freezed: ^3.2.5
        freezed_annotation: ^3.1.0
        carousel_slider: ^5.1.2
        flutter_screenutil: ^5.9.3
        lottie: ^3.4.0
        font_awesome_flutter: ^11.0.0
        flutter_widget_from_html: ^0.17.2
        logger: ^2.7.0
        yaml_edit: ^2.2.4
        go_router: ^17.3.0
        flutter_inappwebview: ^6.1.5
        background_downloader: ^9.5.5
        rxdart: ^0.28.0
        flutter_html: ^3.0.0
        firebase_core: ^4.11.0
        firebase_messaging: ^16.4.1
        firebase_crashlytics: ^5.2.4
        firebase_analytics: ^12.4.3
        firebase_auth: ^6.5.4
        #firebase_remote_config: ^6.3.0
        clarity_flutter: ^1.9.0
        in_app_update: ^4.2.5
        package_info_plus: ^10.2.0
        cached_network_image: ^3.4.1
        flutter_secure_storage: ^10.3.1
        flutter_image_compress: ^2.4.0
        path: ^1.9.1
        path_provider: ^2.1.6
        sqflite: ^2.4.3
        permission_handler: ^12.0.3

      dev_dependencies:
        flutter_test:
          sdk: flutter
        flutter_lints: ^6.0.0
        dart_code_linter: ^4.1.5
        melos: ^8.0.0
        json_serializable: ^6.14.0
        build_runner: ^2.15.0
        envied_generator: ^1.3.7
        # Pinned: intl_utils 2.8.15+ requires analyzer ^13, which conflicts
        # with freezed 3.2.5 (analyzer <11). 2.8.14 resolves on analyzer 10.x.
        intl_utils: 2.8.14
        mockito: ^5.7.0

  scripts:
    analyze:
      run: melos exec -- flutter analyze

    clean_and_get:
      run: melos exec -- flutter clean && melos bootstrap
      description: Cleans and then fetches dependencies for all packages.

    # generate:barrels:
    #   run: dart run melos_scripts/barrel_generator.dart
    #   description: Update all package barrel files

    update_overrides:
      run: melos exec -- dart run $(pwd)/scripts/pubspec_overrides.dart && melos
        bootstrap

    outdated:
      description: Check outdated dependencies in all Flutter packages
      exec: flutter pub outdated
      packageFilters:
        flutter: true

    outdated:all:
      description: Check all packages, including pure Dart packages
      steps:
        - melos run outdated --no-select
        - melos exec --no-private -- "dart pub outdated"

    gen:env:
      run: melos exec --scope="app_env" -- "dart run build_runner build --delete-conflicting-outputs"

    build_runner: |
      melos exec -c 1 --scope="domain" --scope="data" -- \
        dart run build_runner build --delete-conflicting-outputs

    build_runner_feature:
      description: Run build_runner for feature packages only
      exec: dart run build_runner build --delete-conflicting-outputs
      packageFilters:
        tags:
          - feature
        dependsOn: build_runner

    locale_gen:
      run: melos exec --scope localization -- flutter gen-l10n

    update_minor_deps:
      description: Update minor dependencies
      run: dart run melos_minor_deps_update.dart

    update_major_deps:
      description: Update major dependencies
      run: dart run melos_major_deps_update.dart

    # Production APK builds
    build:apk:production:release:
      run: melos exec --scope="app" -- flutter build apk --target=lib/main.dart
        --flavor production --release
      description: Build production APK (release mode)

    # Development APK builds
    build:apk:development:release:
      run: melos exec --scope="app" -- flutter build apk --target=lib/main.dart
        --flavor development --release
      description: Build development APK (release mode)
