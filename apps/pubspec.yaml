name: app
description: "A new Flutter project."
publish_to: "none"
resolution: workspace

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  code_analyzer: ^0.0.1
  di: ^0.0.1
  localization: ^0.0.1
  designsystem: ^0.0.1

  cupertino_icons: ^1.0.9
  flutter_bloc: ^9.1.1
  flutter_screenutil: ^5.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  dart_code_linter: ^4.0.2
  intl_utils: ^2.8.14

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/
    - assets/images/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

  config:
    enable-lldb-debugging: false
