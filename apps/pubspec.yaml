name: app
description: "A new Flutter project."
publish_to: "none"
resolution: workspace

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  code_analyzer: ^0.0.1
  di: ^0.0.1
  localization: ^0.0.1
  designsystem: ^0.0.1
  pref_storage: ^0.0.1
  common: ^0.0.1
  data: ^0.0.1
  domain: ^0.0.1
  app_env: ^0.0.1

  cupertino_icons: ^1.0.9
  flutter_bloc: ^9.1.1
  flutter_screenutil: ^5.9.3
  get_it: ^9.2.1
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  firebase_crashlytics: ^5.2.4
  firebase_analytics: ^12.4.5
  firebase_auth: ^6.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  dart_code_linter: ^4.1.5
  intl_utils: 2.8.14 # see analyzer/freezed pin note in root pubspec.yaml

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/
    - assets/images/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Thin.ttf
          weight: 100
        - asset: assets/fonts/Roboto-Light.ttf
          weight: 300
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Black.ttf
          weight: 900

  config:
    enable-lldb-debugging: false
