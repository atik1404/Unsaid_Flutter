# Memory budget.
#
# These numbers must fit the SMALLEST machine that builds this app, which is a
# GitHub-hosted `ubuntu-latest` runner: 2 vCPU / 7 GB RAM / 14 GB disk. The
# previous `-Xmx8G -XX:MaxMetaspaceSize=4G` asked for more heap than the runner
# physically has — and because the Kotlin daemon inherits `org.gradle.jvmargs`
# when `kotlin.daemon.jvmargs` is unset, it asked for it *twice* — so CI builds
# died mid-run (OOM-killed daemon / "Gradle build daemon disappeared
# unexpectedly") while the same build passed on a developer laptop.
#
# 4 GB is comfortably above what R8 + dexing need for this module; raise it in
# your personal ~/.gradle/gradle.properties rather than here if you want more
# locally.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Bound the Kotlin compile daemon explicitly; otherwise it mirrors the value
# above and the two JVMs together exceed the runner.
kotlin.daemon.jvmargs=-Xmx1500m
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
android.r8.proguardAndroidTxt.disallowed=false