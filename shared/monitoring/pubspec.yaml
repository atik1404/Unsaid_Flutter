name: monitoring
description: "Application stability monitoring (Sentry): crash, ANR, fatal & non-fatal exception reporting."
publish_to: none
version: 0.0.1
resolution: workspace

# Note: The environment configuration and dependency versions are managed by Melos.
#
# Do not edit them manually.
#
# Steps to update dependencies:
#   1. Modify the version in the pubspec.yaml file.
#   2. Run `melos bootstrap` to apply changes.
#
# Steps to add a new dependency:
#   1. Add the dependency to this list.
#   2. Add it to the pubspec.yaml file for future updates.

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  code_analyzer: ^0.0.1
  common: ^0.0.1

  # Stability monitoring backend.
  sentry_flutter: ^9.0.0

  # Bloc observer hooks business-logic errors into the crash reporter.
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  dart_code_linter: ^4.1.7
